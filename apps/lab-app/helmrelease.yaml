apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab-app
  namespace: lab-app
spec:
  interval: 5m
  chart:
    spec:
      chart: charts/helm-deploy
      sourceRef:
        kind: GitRepository
        name: lab-charts
        namespace: flux-system
      interval: 1m
  values:
    replicaCount: 1
