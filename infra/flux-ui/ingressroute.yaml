---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flux-web-ui
  namespace: flux-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`flux-web.localhost`)
      kind: Rule
      services:
        - name: release-name-flux-operator
          namespace: flux-system
          port: 9080
