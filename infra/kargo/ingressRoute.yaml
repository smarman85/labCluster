---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kargo.localhost`)
      kind: Rule
      services:
        - name: kargo-api
          port: 443
          scheme: https
          serversTransport: insecure-transport
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: insecure-transport
  namespace: kargo
spec:
  insecureSkipVerify: true
