---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localstack
  namespace: argocd
spec:
  destination:
    namespace: localstack
    name: in-cluster
  project: default
  source:
    path: charts/infra/localstack
    repoURL: https://github.com/smarman85/labCluster.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 2