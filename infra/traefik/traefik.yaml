---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: treafik-demo
  namespace: argocd
spec:
  destination:
    namespace: traefik
    name: in-cluster
  project: default
  source:
    path: charts/traefik
    repoURL: https://github.com/smarman85/kindSampleCluster.git
    targetRevision: HEAD
    helm:
      values: |
        # values.yaml
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`dashboard.localhost`)
            entryPoints:
              - web
        providers:
          kubernetesGateway:
            enabled: true
        gateway:
          listeners:
            web:
              namespacePolicy:
                from: All
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 1
