# experiments/gitea-runner/gitea-runner.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: actions
    targetRevision: "*"
    helm:
      valuesObject:
        enabled: true
        giteaRootURL: 'http://gitea-http.gitea:3000'
        existingSecret: gitea-runner-secret
        existingSecretKey: runner-token
        statefulset:
          replicas: 1
          extraVolumes:
            - name: docker-daemon-config
              configMap:
                name: docker-daemon-config
          runner:
            tag: "3.0.2"
          dind:
            tag: "29.7.1-dind"
      			extraVolumeMounts:
              - name: docker-daemon-config
                mountPath: /etc/docker/daemon.json
                subPath: daemon.json
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
