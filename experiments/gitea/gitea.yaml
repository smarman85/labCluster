---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  destination:
    namespace: gitea
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/gitea
    repoURL: https://github.com/smarman85/labCluster.git
    targetRevision: HEAD
    helm:
      values: |
        gitea:
          admin:
            username: "gitea-admin"
            password: "admin1234"
            email: "gitea-admin@noreply.com"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 1
