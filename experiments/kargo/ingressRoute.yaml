---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-ingress
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  project: default
  source:
    path: infra/kargo
    repoURL: https://github.com/smarman85/labCluster.git
    targetRevision: HEAD
    directory:
      include: "ingressRoute.yaml"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

