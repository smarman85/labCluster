---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-rollouts
  namespace: cluster-config
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./bootstrap/argo-rollouts
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: argo-rollouts
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blue-green
  namespace: cluster-config
spec:
  interval: 1m
  targetNamespace: blue-green
  dependsOn:
    - name: argo-rollouts
  sourceRef:
    kind: GitRepository
    name: kind-sample-cluster
    namespace: cluster-config
  path: charts/blue-green
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: v1
kind: Namespace
metadata:
  name: blue-green
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kind-sample-cluster
  namespace: cluster-config
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/smarman85/kindSampleCluster.git
