# infra/argocd/traefik.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smarman85/labCluster
    targetRevision: main
    path: charts/rendered/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  # This is a known ArgoCD issue with newer Kubernetes versions. The ipMode field was added to the 
  # LoadBalancer status in Kubernetes 1.30+ but ArgoCD's bundled OpenAPI schema doesn't know about
  # it yet — so it can't calculate the diff and marks the app as Unknown.
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /status/loadBalancer/ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
