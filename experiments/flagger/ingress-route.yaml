---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-podinfo
  namespace: test
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`podinfo.localhost`)
      kind: Rule
      services:
        - name: podinfo
          kind: TraefikService
          port: 9898
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`prometheus.localhost`)
      kind: Rule
      services:
        - name: flagger-prometheus
          namespace: kube-system
          port: 9090
