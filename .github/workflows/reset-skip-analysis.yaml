name: Reset Flagger skipAnalysis

on:
  push:
    branches:
      - main
    paths:
      - 'experiments/flagger/*-gitops-approval.yaml'

jobs:
  reset-skip-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and reset skipAnalysis flags
        run: |
          #!/bin/bash
          set -e

          CHANGED=false

          # Find all gitops-approval canary files
          for file in experiments/flagger/*-gitops-approval.yaml; do
            if [ -f "$file" ]; then
              echo "Checking $file..."

              # Check if skipAnalysis is true
              if grep -q "skipAnalysis: true" "$file"; then
                echo "Found skipAnalysis: true in $file, resetting to false"

                # Replace skipAnalysis: true with skipAnalysis: false
                sed -i 's/skipAnalysis: true/skipAnalysis: false/g' "$file"
                CHANGED=true
              fi
            fi
          done

          if [ "$CHANGED" = true ]; then
            echo "NEEDS_COMMIT=true" >> $GITHUB_ENV
          else
            echo "NEEDS_COMMIT=false" >> $GITHUB_ENV
          fi

      - name: Commit and push if changed
        if: env.NEEDS_COMMIT == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add experiments/flagger/*-gitops-approval.yaml
          git commit -m "chore: auto-reset skipAnalysis to false after promotion"
          git push
