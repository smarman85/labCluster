---
name: ImagePromote

on:
  workflow_dispatch:
    inputs:
      imageRepoWithTag:
        description: "Image Repository name with tag ie: (some-repo:v1.1.1)"
        required: true
        type: string
      # file_path:
      #   description: "Path to the mainifest file that holds the image tag definition"
      #   required: true
      #   type: string

permissions:
  id-token: write
  contents: read
  packages: read
  pull-requests: write

jobs:
  promote-dev:
    name: Promote to Dev
    uses: smarman85/labCluster/.github/workflows/cd.yaml@main
    with:
      TAG: ${{ inputs.imageRepoWithTag }}
      #FILE_PATH: ${{ inputs.file_path }}
      FILE_PATH: experiments/cd/helmRelease/manifest.yaml

  promote-sandbox:
    name: Promote to Sandbox
    needs: [promote-dev]
    uses: smarman85/labCluster/.github/workflows/cd.yaml@main
    with:
      TAG: ${{ inputs.imageRepoWithTag }}
      FILE_PATH: experiments/cd/helmRelease/sandbox/manifest.yaml

  promote-prod:
    name: Promote to Prod
    needs: [promote-sandbox]
    uses: smarman85/labCluster/.github/workflows/cd.yaml@main
    with:
      TAG: ${{ inputs.imageRepoWithTag }}
      FILE_PATH: experiments/cd/helmRelease/prod/manifest.yaml

