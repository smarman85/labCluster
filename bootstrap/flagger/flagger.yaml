# Source: flagger/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger
  namespace: kube-system
  labels:
    helm.sh/chart: flagger-1.43.0
    app.kubernetes.io/name: flagger
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: flagger
    app.kubernetes.io/version: 1.43.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flagger
      app.kubernetes.io/instance: flagger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagger
        app.kubernetes.io/instance: flagger
        app.kubernetes.io/version: 1.43.0
      annotations:
        appmesh.k8s.aws/sidecarInjectorWebhook: disabled
        linkerd.io/inject: enabled
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: flagger
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: 'flagger'
                  app.kubernetes.io/name: 'flagger'
              topologyKey: kubernetes.io/hostname
            weight: 100                  
      containers:
        - name: flagger
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 10001
          image: "ghcr.io/fluxcd/flagger:1.43.0"
          imagePullPolicy: IfNotPresent
          ports:
          - name: http
            containerPort: 8080
          command:
          - ./flagger
          - -log-level=info
          - -mesh-provider=traefik
          - -metrics-server=http://flagger-prometheus:9090
          - -enable-config-tracking=true
          - -slack-user=flagger
          livenessProbe:
            exec:
              command:
              - wget
              - --quiet
              - --tries=1
              - --timeout=4
              - --spider
              - http://localhost:8080/healthz
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
              - wget
              - --quiet
              - --tries=1
              - --timeout=4
              - --spider
              - http://localhost:8080/healthz
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 32Mi
---
# Source: flagger/templates/prometheus.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-prometheus
  namespace: kube-system
  labels:
    helm.sh/chart: flagger-1.43.0
    app.kubernetes.io/name: flagger
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: flagger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagger-prometheus
      app.kubernetes.io/instance: flagger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagger-prometheus
        app.kubernetes.io/instance: flagger
      annotations:
        appmesh.k8s.aws/sidecarInjectorWebhook: disabled
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: flagger-prometheus
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v2.41.0
          imagePullPolicy: IfNotPresent
          args:
            - '--storage.tsdb.retention.time=2h'
            - '--config.file=/etc/prometheus/prometheus.yml'
            ### Used to send prometheus traffic to the other installed prometheus
            ### Installed by default in the lab cluster
            - '--web.external-url=http://prometheus.localhost:8888'
            - '--web.route-prefix=/'
          ports:
            - containerPort: 9090
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: data-volume
              mountPath: /prometheus/data
      volumes:
        - name: config-volume
          configMap:
            name: flagger-prometheus
        - name: data-volume
          emptyDir: {}
